llm:
  ollama:
    base_url: "http://localhost:11434"
  gemini:
    model_name: "gemini-2.5-flash-lite"
    max_retries: 3
    rate_limit:
      requests_per_window: 8
      sleep_seconds: 60
      retry_wait_seconds: 10
  qwen:
    model_name: "qwen2.5-coder:7b-instruct"
    request_timeout_seconds: 120
    max_retries: 3
    retry_wait_seconds: 5
  embedding:
    batch_size: 32
    gemini:
      model_name: "gemini-embedding-001"
      task_type: "RETRIEVAL_DOCUMENT"
      dimensions: 768
      batch_size: 100
    jina:
      model_name: "unclemusclez/jina-embeddings-v2-base-code:q4"
      batch_size: 8
      timeout_seconds: 180
      max_retries: 3
      retry_backoff_seconds: 5
    ollama:
      model_name: "nomic-embed-text"
      timeout_seconds: 60
  summarizer:
    gemini:
      model_name: "gemini-2.5-flash-lite"
      temperature: 0.1
      max_tokens_per_batch: 50000
      max_nodes_per_batch: 24
      chars_per_token: 4
      max_rate_limit_retries: 3
    qwen:
      model_name: "qwen2.5-coder:7b-instruct"
      temperature: 0
      request_timeout_seconds: 180
      max_tokens_per_batch: 4000
      max_single_node_tokens: 3500
      max_nodes_per_batch: 3
      chars_per_token: 3
      max_retries: 3
      retry_wait_seconds: 5
